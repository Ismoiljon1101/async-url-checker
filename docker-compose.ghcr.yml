# Run the pre-built images from GitHub Container Registry — no local build needed.
#   docker compose -f docker-compose.ghcr.yml up
# Images are published by .github/workflows/docker-publish.yml on every push to main.
services:
  backend:
    image: ghcr.io/ismoiljon1101/async-url-checker-backend:latest
    ports:
      - "3000:3000"
    environment:
      MAX_CHECK_DELAY_MS: "10000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: ghcr.io/ismoiljon1101/async-url-checker-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
