services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      # Override to speed up or slow down the simulated per-URL delay.
      MAX_CHECK_DELAY_MS: "10000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
